# 城市空气质量分析系统 —— 一键编排
# 读者流程：
#   1. 把下载的原始 CSV 放到 data/raw（递归识别 china_cities_*.csv）
#   2. （可选）复制 .env.example 为 .env 并修改密码
#   3. docker compose run --rm pipeline     # 一键处理数据集
#   4. docker compose up -d web             # 启动 Web 服务
services:
  mysql:
    image: mysql:8.0
    container_name: sky-mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASS:-123456}
      MYSQL_DATABASE: ${MYSQL_DB:-air_quality}
    volumes:
      - mysql_data:/var/lib/mysql
      # 首次初始化空数据卷时自动建表（含字典数据）
      - ./data/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost",
             "-p${MYSQL_PASS:-123456}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  pipeline:
    build: .
    image: sky-air
    container_name: sky-pipeline
    command: ["python", "run_pipeline.py"]
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_DB: ${MYSQL_DB:-air_quality}
      MYSQL_PASS: ${MYSQL_PASS:-123456}
    volumes:
      # 原始数据只读挂载；算法产物回写到宿主，便于论文引用
      - ./data/raw:/app/data/raw:ro
      - ./data/analysis/output:/app/data/analysis/output
    profiles: ["pipeline"]

  web:
    build: .
    image: sky-air
    container_name: sky-web
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_DB: ${MYSQL_DB:-air_quality}
      MYSQL_PASS: ${MYSQL_PASS:-123456}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  mysql_data:
